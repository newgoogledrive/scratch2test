<body>
      <h1>scratch 2 project test!</h1>
      <p>this is a test where i used ruffle on the scratch 2 player and made a smaple project. it works!</p>
      <div id="container" style="width: 550px; height: 400px;"></div>
<script>
    
    window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay":"hidden"
      };
    window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("container");
        container.appendChild(player);
        player.ruffle().load("https://cst1229.eu.org/TBCAMuseum-builds/scratch2/Scratch%20v461%20(2).swf?project=./project.sb2");
    });
</script>
<script src="./ruffle.js"></script>
</body>
