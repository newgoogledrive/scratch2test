<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scratch 2 Loader</title>
  <script src="./ruffle.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      display: grid;
      place-items: center;
      height: 100vh;
    }
    #game {
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      player.style.width = "800px";
      player.style.height = "600px";

      document.getElementById("game").appendChild(player);

      player.load({
        url: "https://cst1229.eu.org/TBCAMuseum-builds/scratch2/Scratch%20v461%20(2).swf",
        parameters: {
          project: "https://newgoogledrive.github.io/scratch2test/project.sb2"
        }
      });
    });
  </script>
</body>
</html>
